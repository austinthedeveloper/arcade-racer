# Every Godot test suite plus the end-to-end input smoke, headless on
# Linux, with the same script as a local run (tools/test.sh fails on
# any failed test or SCRIPT ERROR).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same ref supersedes a running check.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Godot tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-godot

      - name: Import the project
        # test.sh imports too, silently; this one shows its log.
        run: godot --headless --path . --import

      - name: Tests (suites + e2e)
        run: tools/test.sh

  # The exported Linux build (unsupported platform, kept so the export
  # pipeline and a later Steam Deck test stay working) starts and plays.
  smoke:
    name: Linux export smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-godot
        with:
          templates: "true"

      - name: Import the project
        run: godot --headless --path . --import

      - name: Export Linux
        run: |
          mkdir -p build/linux
          godot --headless --path . --export-release Linux build/linux/SundownRun.x86_64 2>&1 | tee build/export.log
          test -s build/linux/SundownRun.x86_64
          ! grep -q "ERROR:" build/export.log

      - name: Run the exported build headless
        run: |
          # --autodrive (a user arg, after --) starts a race by itself.
          set +e
          timeout 120 build/linux/SundownRun.x86_64 --headless --quit-after 300 -- --autodrive 2>&1 | tee build/smoke.log
          code=${PIPESTATUS[0]}
          set -e
          [ "$code" -eq 0 ] || { echo "exit code $code"; exit 1; }
          ! grep -q "SCRIPT ERROR" build/smoke.log
